<!doctype html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 测测</title>
  <meta name="description" content="AI 测测：一个入口，探索你的人格原型与塔罗启示。" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com">
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body class="h-full overflow-hidden bg-[#f8f7f4] text-slate-800 antialiased">
  <script>
    try {
      if (!localStorage.getItem('ai_test_token')) {
        location.replace((location.protocol === 'file:' ? 'http://localhost:3000' : '') + '/login.html');
      }
    } catch {
      location.replace('http://localhost:3000/login.html');
    }
  </script>
  <div class="pointer-events-none fixed inset-0 -z-10">
    <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-violet-200/40 blur-3xl"></div>
    <div class="absolute right-0 top-1/4 h-80 w-80 rounded-full bg-sky-200/35 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-amber-200/30 blur-3xl"></div>
  </div>

  <main class="mx-auto flex h-full w-full max-w-7xl flex-col px-5 py-6 sm:px-8 lg:px-10">
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-400 text-white shadow-lg shadow-slate-200/60">
          <i data-lucide="sparkles" class="h-5 w-5"></i>
        </div>
        <span class="text-lg font-bold tracking-tight text-slate-900">AI 测测</span>
      </div>
      <div class="relative">
        <button id="userMenuButton" class="group flex items-center gap-2 rounded-2xl bg-white/80 px-2 py-1.5 ring-1 ring-slate-200 transition hover:bg-white">
          <span id="userAvatar" class="flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-sky-400 text-xs font-bold text-white">AI</span>
          <span id="userMeta" class="hidden text-left leading-tight">
            <span id="userName" class="block text-sm font-semibold text-slate-800"></span>
            <span id="userGender" class="block text-[11px] text-slate-500"></span>
          </span>
          <i data-lucide="chevron-down" class="h-4 w-4 text-slate-400"></i>
        </button>

        <div id="userMenu" class="hidden absolute right-0 top-14 z-40 w-80 rounded-3xl bg-white/95 p-2 shadow-xl shadow-slate-200/60 ring-1 ring-slate-200 backdrop-blur">
          <div class="px-3 py-3">
            <p class="text-xs font-medium text-slate-400">当前账号</p>
            <p id="menuUserName" class="mt-1 text-sm font-semibold text-slate-900"></p>
            <p id="menuUserGender" class="text-xs text-slate-500"></p>
          </div>
          <div class="my-1 h-px bg-slate-100"></div>

          <p class="px-3 pb-1 pt-2 text-[11px] font-medium text-slate-400">个人中心</p>
          <button data-action="profile" class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-slate-50">
            <i data-lucide="user" class="h-4 w-4 text-slate-400"></i>
            <span>
              <span class="block text-sm font-medium text-slate-800">基本资料</span>
              <span class="block text-xs text-slate-500">名字、性别与账号信息</span>
            </span>
          </button>
          <button data-action="memory" class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-slate-50">
            <i data-lucide="brain" class="h-4 w-4 text-slate-400"></i>
            <span>
              <span class="block text-sm font-medium text-slate-800">我的记忆</span>
              <span class="block text-xs text-slate-500">查看摘要与记忆状态</span>
            </span>
          </button>
          <button data-action="sessions" class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-slate-50">
            <i data-lucide="messages-square" class="h-4 w-4 text-slate-400"></i>
            <span>
              <span class="block text-sm font-medium text-slate-800">我的会话</span>
              <span class="block text-xs text-slate-500">切换或整理历史对话</span>
            </span>
          </button>
          <button data-action="tests" class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-slate-50">
            <i data-lucide="compass" class="h-4 w-4 text-slate-400"></i>
            <span>
              <span class="block text-sm font-medium text-slate-800">我的测试</span>
              <span class="block text-xs text-slate-500">查看历史人物与塔罗结果</span>
            </span>
          </button>

          <div class="my-1 h-px bg-slate-100"></div>

          <p class="px-3 pb-1 pt-2 text-[11px] font-medium text-slate-400">设置</p>
          <button data-action="preferences" class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-slate-50">
            <i data-lucide="sliders-horizontal" class="h-4 w-4 text-slate-400"></i>
            <span>
              <span class="block text-sm font-medium text-slate-800">偏好设置</span>
              <span class="block text-xs text-slate-500">语气、节奏与回复风格</span>
            </span>
          </button>
          <button data-action="appearance" class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-slate-50">
            <i data-lucide="palette" class="h-4 w-4 text-slate-400"></i>
            <span>
              <span class="block text-sm font-medium text-slate-800">外观与字体</span>
              <span class="block text-xs text-slate-500">界面密度与阅读舒适度</span>
            </span>
          </button>
          <button data-action="privacy" class="menu-item flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-slate-50">
            <i data-lucide="shield" class="h-4 w-4 text-slate-400"></i>
            <span>
              <span class="block text-sm font-medium text-slate-800">数据与隐私</span>
              <span class="block text-xs text-slate-500">导出、删除与记忆开关</span>
            </span>
          </button>
          <button id="logoutButton" class="menu-item mt-1 flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left transition hover:bg-rose-50">
            <i data-lucide="log-out" class="h-4 w-4 text-rose-500"></i>
            <span class="block text-sm font-medium text-rose-600">退出登录</span>
          </button>
        </div>
      </div>
    </header>

    <section id="features" class="mt-6 grid min-h-0 flex-1 gap-8 lg:grid-cols-[.85fr_1.15fr]">
      <div class="flex min-h-0 flex-col gap-5 overflow-y-auto pr-1">
        <h1 class="text-3xl font-black leading-tight tracking-tight text-slate-900 sm:text-4xl">
          你今天想看看
          <span class="bg-gradient-to-r from-violet-400 via-sky-400 to-emerald-300 bg-clip-text text-transparent">哪一个自己</span>？
        </h1>
        <p class="max-w-xl text-sm leading-7 text-slate-600">
          直接告诉我你的问题或状态，我会帮你判断适合先看性格，还是先看塔罗。
        </p>
        <div class="grid gap-4 sm:grid-cols-1">
          <a href="https://history-persona-quiz.pages.dev" target="_blank" rel="noopener noreferrer" class="group rounded-3xl bg-white/80 p-6 shadow-lg shadow-slate-200/50 ring-1 ring-slate-200 transition hover:-translate-y-1 hover:bg-white">
            <div class="mb-5 flex items-center gap-4">
              <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-50 text-indigo-500">
                <i data-lucide="landmark" class="h-5 w-5"></i>
              </div>
              <div>
                <p class="text-xs font-medium text-indigo-500">性格原型</p>
                <h2 class="text-lg font-bold">历史人物测验</h2>
              </div>
            </div>
            <p class="text-sm text-slate-600">透过古风情景题，找到和你心性最接近的历史人物。</p>
          </a>
          <a href="https://tarocard.pages.dev" target="_blank" rel="noopener noreferrer" class="group rounded-3xl bg-white/80 p-6 shadow-lg shadow-slate-200/50 ring-1 ring-slate-200 transition hover:-translate-y-1 hover:bg-white">
            <div class="mb-5 flex items-center gap-4">
              <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-sky-50 text-sky-500">
                <i data-lucide="moon-star" class="h-5 w-5"></i>
              </div>
              <div>
                <p class="text-xs font-medium text-sky-500">塔罗启示</p>
                <h2 class="text-lg font-bold">AI 塔罗占卜</h2>
              </div>
            </div>
            <p class="text-sm text-slate-600">带着一个问题进入牌面，看看当下状态与方向。</p>
          </a>
        </div>
      </div>

      <div class="flex min-h-0 flex-col rounded-3xl bg-white/80 p-1 shadow-xl shadow-slate-200/60 ring-1 ring-slate-200 backdrop-blur">
        <div class="flex min-h-0 flex-1 flex-col rounded-3xl bg-white/90 p-5 sm:p-6">
          <div class="mb-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-50 text-indigo-500">
                <i data-lucide="sparkles" class="h-4 w-4"></i>
              </div>
              <div>
                <p class="text-sm font-semibold text-slate-800">AI 测测助手</p>
                <p class="text-xs text-slate-500">输入你的问题，我会给你方向</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <select id="sessionSelect" title="历史会话" class="max-w-[8.5rem] rounded-lg bg-slate-50 px-2 py-1.5 text-xs text-slate-500 outline-none ring-1 ring-slate-200"></select>
              <button id="newSession" title="新会话" class="rounded-lg px-2 py-1.5 text-xs text-slate-500 transition hover:bg-slate-100 hover:text-slate-800">＋</button>
              <button id="renameSession" title="重命名" class="rounded-lg px-2 py-1.5 text-xs text-slate-500 transition hover:bg-slate-100 hover:text-slate-800">✎</button>
              <button id="deleteSession" title="删除" class="rounded-lg px-2 py-1.5 text-xs text-slate-500 transition hover:bg-slate-100 hover:text-slate-800">🗑</button>
            </div>
          </div>
          <div id="chat" class="min-h-0 flex-1 space-y-4 overflow-y-auto pr-1 text-sm"></div>
          <div id="promptSuggestions" class="mt-4">
            <p id="promptSuggestionsLabel" class="mb-2 px-1 text-xs font-medium text-slate-500">推荐问</p>
            <div id="promptSuggestionsRow" class="flex flex-wrap gap-2"></div>
          </div>
          <div class="mt-5 rounded-2xl bg-slate-50 p-2 ring-1 ring-slate-200">
            <textarea id="prompt" rows="3" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行" class="max-h-40 w-full resize-none bg-transparent px-3 py-2 text-sm text-slate-800 outline-none placeholder:text-slate-400"></textarea>
            <div class="flex items-center justify-between px-1">
              <span class="text-xs text-slate-400">Enter 发送 · Shift + Enter 换行</span>
              <button id="send" class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-indigo-500 to-sky-400 px-4 py-2 text-sm font-semibold text-white transition hover:brightness-110 disabled:opacity-50">发送</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="mt-4 shrink-0 text-center text-xs text-slate-400">
      © <span id="year"></span> AI 测测 · 探索更多面向的自己
    </footer>
  </main>

  <div id="userPanelOverlay" class="fixed inset-0 z-50 hidden bg-slate-900/25 backdrop-blur-sm">
    <aside class="absolute bottom-4 right-4 top-4 flex w-[calc(100%-2rem)] max-w-md flex-col rounded-3xl bg-white/95 p-5 shadow-2xl shadow-slate-400/30 ring-1 ring-slate-200 backdrop-blur sm:w-full">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p id="panelEyebrow" class="text-xs font-medium text-slate-400">个人中心</p>
          <h2 id="panelTitle" class="mt-1 text-xl font-bold tracking-tight text-slate-900"></h2>
        </div>
        <button id="panelClose" class="rounded-xl px-2 py-1 text-lg leading-none text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">×</button>
      </div>
      <div id="panelBody" class="mt-5 min-h-0 flex-1 space-y-4 overflow-y-auto pr-1"></div>
    </aside>
  </div>

  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
  <script defer src="config.js?v=5"></script>
  <script defer src="auth-guard.js?v=4"></script>
  <script defer src="app.js?v=7"></script>
</body>
</html>
